<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HBM 3D 분해도</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#05070d;}
  #app{position:fixed;inset:0;touch-action:none;
    background:radial-gradient(125% 120% at 50% 28%, #1b2438 0%, #0a0e18 56%, #04060c 100%);}
  canvas{display:block;}
  .ui{position:absolute;color:#e8edf6;
    font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;}

  #title{top:20px;left:22px;}
  #title h1{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    font-size:18px;font-weight:600;letter-spacing:3px;}
  #title p{font-size:12px;color:#8a96ad;margin-top:4px;letter-spacing:.3px;}

  #topright{top:18px;right:16px;display:flex;gap:8px;}
  .btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
    color:#cdd6e6;font-size:12.5px;padding:8px 13px;border-radius:11px;cursor:pointer;
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:.18s;}
  .btn:hover{background:rgba(255,255,255,.13);}
  .btn.active{background:rgba(96,140,255,.24);border-color:rgba(125,165,255,.5);color:#dce6ff;}

  #bottom{bottom:24px;left:50%;transform:translateX(-50%);width:min(440px,88vw);text-align:center;}
  #hint{font-size:11.5px;color:#7e8aa1;margin-bottom:11px;line-height:1.6;letter-spacing:.2px;}
  .slider-wrap{display:flex;align-items:center;gap:12px;
    background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.1);
    padding:10px 16px;border-radius:15px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);}
  .slider-wrap span{font-size:11px;color:#9aa6bd;white-space:nowrap;letter-spacing:.5px;}
  input[type=range]{-webkit-appearance:none;appearance:none;height:4px;flex:1;
    background:rgba(255,255,255,.16);border-radius:3px;outline:none;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;
    border-radius:50%;background:#6f9bff;cursor:pointer;box-shadow:0 0 0 4px rgba(111,155,255,.22);}
  input[type=range]::-moz-range-thumb{width:16px;height:16px;border:none;border-radius:50%;
    background:#6f9bff;cursor:pointer;}

  #panel{top:0;right:0;height:100%;width:330px;padding:78px 24px 24px;
    background:linear-gradient(180deg,rgba(12,17,27,.84),rgba(9,13,21,.93));
    -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
    border-left:1px solid rgba(255,255,255,.07);
    transform:translateX(106%);transition:transform .38s cubic-bezier(.2,.75,.2,1);}
  #panel.open{transform:translateX(0);}
  #panel .accent{width:40px;height:4px;border-radius:3px;background:#6f9bff;margin-bottom:16px;}
  #panel .tag{display:inline-block;font-family:ui-monospace,Menlo,monospace;font-size:10.5px;
    letter-spacing:1px;color:#9fb6ff;background:rgba(111,155,255,.1);
    border:1px solid rgba(111,155,255,.25);padding:4px 10px;border-radius:20px;margin-bottom:15px;}
  #panel h2{font-size:18px;font-weight:650;line-height:1.35;margin-bottom:14px;}
  #panel .body{font-size:13.5px;line-height:1.75;color:#b6c0d5;}
  #close{position:absolute;top:22px;right:22px;width:32px;height:32px;border-radius:9px;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
    color:#cdd6e6;font-size:17px;line-height:1;cursor:pointer;}

  @media (max-width:720px){
    #panel{top:auto;bottom:0;right:0;width:100%;height:auto;max-height:54%;
      padding:24px 22px 28px;border-left:none;border-top:1px solid rgba(255,255,255,.08);
      border-radius:22px 22px 0 0;transform:translateY(108%);overflow-y:auto;}
    #panel.open{transform:translateY(0);}
    #bottom{bottom:18px;}
    #title h1{font-size:16px;letter-spacing:2px;}
  }
</style>
</head>
<body>
  <div id="app"></div>

  <div class="ui" id="title">
    <h1>HBM</h1>
    <p>High Bandwidth Memory · 구조 인터랙티브</p>
  </div>

  <div class="ui" id="topright">
    <button class="btn" id="rotateBtn">자동 회전</button>
    <button class="btn" id="resetBtn">초기화</button>
  </div>

  <div class="ui" id="bottom">
    <div id="hint">드래그로 회전 · 스크롤 / 두 손가락 핀치 / 슬라이더로 펼치고 접기 · 부품을 탭하면 설명</div>
    <div class="slider-wrap">
      <span>조립</span>
      <input type="range" id="slider" min="0" max="100" value="0">
      <span>분해</span>
    </div>
  </div>

  <div class="ui" id="panel">
    <button id="close">×</button>
    <div class="accent"></div>
    <div class="tag" id="panelTag"></div>
    <h2 id="panelTitle"></h2>
    <div class="body" id="panelBody"></div>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const INFO = {
  substrate:{tag:'SUBSTRATE', title:'패키지 기판 (Package Substrate)',
    body:'전체 패키지를 받치고 메인보드(PCB)에 연결하는 기판입니다. 전원과 신호를 외부로 전달하며, 그 위에 인터포저와 칩들이 올라갑니다.'},
  interposer:{tag:'INTERPOSER', title:'실리콘 인터포저 (Interposer)',
    body:'HBM과 GPU(또는 SoC)를 같은 패키지 안에서 잇는 얇은 실리콘 기판입니다. 수천 개 이상의 미세 배선으로 초고대역폭 연결을 만들며, 이런 방식을 2.5D 패키징이라고 합니다.'},
  base:{tag:'LOGIC DIE', title:'베이스 다이 (Base / Logic Die)',
    body:'스택의 맨 아래층으로 메모리 컨트롤러·입출력(PHY) 역할을 합니다. 위에 쌓인 DRAM 다이들과 인터포저 사이에서 데이터가 드나드는 관문입니다.'},
  dram:{tag:'DRAM DIE', title:'DRAM 다이 (DRAM Die)',
    body:'실제 데이터를 저장하는 메모리 셀이 들어있는 층입니다. HBM은 이런 다이를 여러 장(보통 8~12층, 최신 세대는 16층까지) 수직으로 쌓아 용량과 대역폭을 동시에 끌어올립니다.'},
  tsv:{tag:'CORE TECH', title:'TSV · 실리콘 관통 전극',
    body:'쌓인 다이들을 수직으로 관통하는 구리 전극입니다. 모든 층을 가장 짧은 경로로 연결해, 옆으로 빼는 기존 방식보다 훨씬 빠르고 전력 효율이 높습니다. HBM을 가능하게 한 핵심 기술입니다.'},
  microbump:{tag:'BONDING', title:'마이크로 범프 (Micro Bump)',
    body:'다이와 다이 사이를 물리적·전기적으로 잇는 아주 작은 솔더 범프입니다. TSV와 함께 층 사이 신호를 전달하며, 최신 세대는 범프 없이 직접 붙이는 하이브리드 본딩으로 진화하고 있습니다.'},
};

const app = document.getElementById('app');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
app.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x1a1d26, 0.95));
const key = new THREE.DirectionalLight(0xffffff, 1.15); key.position.set(7, 11, 8); scene.add(key);
const fill = new THREE.DirectionalLight(0x88aaff, 0.45); fill.position.set(-9, 4, -7); scene.add(fill);

// ---- model build ----
const parts = [], pickables = [];
const HALF_W = 3.6, CY = 1.55, SPREAD = 1.4;
const BASE_HALF = 0.2, DRAM_HALF = 0.15;
let baseGroup, topGroup;
let curT = 0, targetT = 0;

function explodeY(baseY){ return CY + (baseY - CY) * (1 + SPREAD * curT); }

function makeBox(w,h,d,color,metal,rough){
  const m = new THREE.MeshStandardMaterial({color, metalness:metal, roughness:rough});
  return new THREE.Mesh(new THREE.BoxGeometry(w,h,d), m);
}
function addEdges(group, mesh, color){
  const e = new THREE.LineSegments(new THREE.EdgesGeometry(mesh.geometry),
    new THREE.LineBasicMaterial({color, transparent:true, opacity:0.55}));
  group.add(e);
}
function addBumps(group, w, dieHalfH){
  const n = 4, span = w*0.72, step = span/(n-1), start = -span/2;
  const mat = new THREE.MeshStandardMaterial({color:0xe6b53c, metalness:0.9, roughness:0.35});
  const im = new THREE.InstancedMesh(new THREE.SphereGeometry(0.05,10,10), mat, n*n);
  const mm = new THREE.Matrix4(); let i=0;
  for(let a=0;a<n;a++) for(let b=0;b<n;b++){
    mm.makeTranslation(start+a*step, -dieHalfH-0.06, start+b*step); im.setMatrixAt(i++, mm);
  }
  im.instanceMatrix.needsUpdate = true;
  im.userData.id = 'microbump';
  group.add(im); pickables.push(im);
}
function makePart(c){
  const g = new THREE.Group(); g.position.y = c.y;
  const b = makeBox(c.w, c.h, c.d, c.color, c.metal, c.rough);
  b.userData.id = c.id; if(c.layer) b.userData.layer = c.layer;
  g.add(b); pickables.push(b);
  addEdges(g, b, c.edge);
  if(c.bumps) addBumps(g, c.w, c.h/2);
  scene.add(g);
  parts.push({group:g, baseY:c.y, halfH:c.h/2});
  return g;
}

makePart({id:'substrate', y:0.00, h:0.5, w:7.0, d:7.0, color:0x123028, edge:0x2f6f5e, metal:0.1, rough:0.85});
makePart({id:'interposer', y:0.40, h:0.3, w:5.5, d:5.5, color:0x586774, edge:0x9fb3c2, metal:0.55, rough:0.4});
baseGroup = makePart({id:'base', y:0.75, h:0.4, w:3.2, d:3.2, color:0x232f3d, edge:0x53708c, metal:0.3, rough:0.5, bumps:true});

let yc = 0.95;
for(let i=0;i<8;i++){
  const cy = yc + DRAM_HALF;
  const col = new THREE.Color().setHSL(0.58, 0.55, 0.46 + i*0.013).getHex();
  const ec  = new THREE.Color().setHSL(0.58, 0.70, 0.70).getHex();
  topGroup = makePart({id:'dram', layer:i+1, y:cy, h:0.3, w:3.2, d:3.2, color:col, edge:ec, metal:0.32, rough:0.46, bumps:true});
  yc = cy + DRAM_HALF;
}

// ---- TSV pillars (threaded through the stack) ----
const TSV_N = 9, tsvPos = [];
for(const x of [-1,0,1]) for(const z of [-1,0,1]) tsvPos.push({x, z});
const tsvMesh = new THREE.InstancedMesh(
  new THREE.CylinderGeometry(0.05, 0.05, 1, 12),
  new THREE.MeshStandardMaterial({color:0xc97b34, metalness:0.92, roughness:0.3}), TSV_N);
tsvMesh.userData.id = 'tsv';
scene.add(tsvMesh); pickables.push(tsvMesh);

// ---- camera orbit state ----
let theta = 0.7, phi = 1.15, autoRotate = false;
const target = new THREE.Vector3();
const _m = new THREE.Matrix4(), _v = new THREE.Vector3(), _q = new THREE.Quaternion(), _s = new THREE.Vector3();

function animate(){
  requestAnimationFrame(animate);
  curT += (targetT - curT) * 0.12;
  if(Math.abs(targetT - curT) < 0.0005) curT = targetT;

  for(const p of parts) p.group.position.y = explodeY(p.baseY);

  const bBottom = baseGroup.position.y - BASE_HALF;
  const tTop = topGroup.position.y + DRAM_HALF;
  const c = (bBottom + tTop)/2, hgt = (tTop - bBottom);
  for(let i=0;i<TSV_N;i++){
    _m.compose(_v.set(tsvPos[i].x, c, tsvPos[i].z), _q, _s.set(1, hgt, 1));
    tsvMesh.setMatrixAt(i, _m);
  }
  tsvMesh.instanceMatrix.needsUpdate = true;

  let minY = Infinity, maxY = -Infinity;
  for(const p of parts){
    const y = p.group.position.y;
    if(y - p.halfH < minY) minY = y - p.halfH;
    if(y + p.halfH > maxY) maxY = y + p.halfH;
  }
  const centerY = (minY + maxY)/2, halfH = (maxY - minY)/2;
  const rs = Math.sqrt(HALF_W*HALF_W*2 + halfH*halfH);
  const vF = camera.fov * Math.PI/180;
  const hF = 2*Math.atan(Math.tan(vF/2) * camera.aspect);
  const dist = (rs / Math.sin(Math.min(vF, hF)/2)) * 1.12;

  if(autoRotate) theta += 0.0028;
  const sp = Math.sin(phi), cp = Math.cos(phi);
  camera.position.set(dist*sp*Math.sin(theta), centerY + dist*cp, dist*sp*Math.cos(theta));
  target.set(0, centerY, 0);
  camera.lookAt(target);
  renderer.render(scene, camera);
}
animate();

// ---- picking ----
const raycaster = new THREE.Raycaster(), pointer = new THREE.Vector2();
const el = renderer.domElement;
const panel = document.getElementById('panel');
const panelTag = document.getElementById('panelTag');
const panelTitle = document.getElementById('panelTitle');
const panelBody = document.getElementById('panelBody');
const slider = document.getElementById('slider');
let selected = null;

function showInfo(id, layer){
  const d = INFO[id]; if(!d) return;
  panelTag.textContent = (id === 'dram' && layer) ? layer + '번째 층' : d.tag;
  panelTitle.textContent = d.title;
  panelBody.textContent = d.body;
  panel.classList.add('open');
}
function restore(o){
  if(o && o.userData.emiOrig !== undefined){
    o.material.emissive.setHex(o.userData.emiOrig);
    o.material.emissiveIntensity = o.userData.eiOrig;
  }
}
function select(o){
  if(selected && selected !== o) restore(selected);
  selected = o;
  if(o.userData.emiOrig === undefined){
    o.userData.emiOrig = o.material.emissive.getHex();
    o.userData.eiOrig = (o.material.emissiveIntensity ?? 1);
  }
  o.material.emissive.setHex(0x2a4d8f);
  o.material.emissiveIntensity = 0.95;
  showInfo(o.userData.id, o.userData.layer);
}
function deselect(){
  restore(selected); selected = null;
  panel.classList.remove('open');
}
function pick(x, y){
  const r = el.getBoundingClientRect();
  pointer.x = ((x - r.left)/r.width)*2 - 1;
  pointer.y = -((y - r.top)/r.height)*2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(pickables, false);
  if(hits.length) select(hits[0].object); else deselect();
}

// ---- mouse ----
let dragging = false, lastX = 0, lastY = 0, downT = 0, moved = 0;
function clampPhi(){ phi = Math.max(0.18, Math.min(Math.PI - 0.18, phi)); }
function clamp01(v){ return Math.max(0, Math.min(1, v)); }

el.addEventListener('mousedown', e=>{ dragging=true; lastX=e.clientX; lastY=e.clientY; downT=performance.now(); moved=0; });
window.addEventListener('mousemove', e=>{
  if(!dragging) return;
  const dx=e.clientX-lastX, dy=e.clientY-lastY; lastX=e.clientX; lastY=e.clientY;
  moved += Math.abs(dx)+Math.abs(dy);
  theta -= dx*0.005; phi -= dy*0.005; clampPhi();
});
window.addEventListener('mouseup', e=>{
  if(dragging && moved < 6 && performance.now()-downT < 350) pick(e.clientX, e.clientY);
  dragging = false;
});
el.addEventListener('wheel', e=>{
  e.preventDefault();
  targetT = clamp01(targetT + (-e.deltaY)*0.0012);
  slider.value = Math.round(targetT*100);
}, {passive:false});

// ---- touch ----
let pinchStart = 0, pinchT = 0, tx = 0, ty = 0, tDownT = 0, tMoved = 0;
function touchDist(e){ const a=e.touches[0], b=e.touches[1]; return Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY); }
el.addEventListener('touchstart', e=>{
  if(e.touches.length === 1){
    const t=e.touches[0]; dragging=true; lastX=t.clientX; lastY=t.clientY;
    tx=t.clientX; ty=t.clientY; tDownT=performance.now(); tMoved=0;
  } else if(e.touches.length === 2){
    dragging=false; pinchStart=touchDist(e); pinchT=targetT;
  }
}, {passive:false});
el.addEventListener('touchmove', e=>{
  e.preventDefault();
  if(e.touches.length === 1 && dragging){
    const t=e.touches[0]; const dx=t.clientX-lastX, dy=t.clientY-lastY; lastX=t.clientX; lastY=t.clientY;
    tMoved += Math.abs(dx)+Math.abs(dy);
    theta -= dx*0.005; phi -= dy*0.005; clampPhi();
  } else if(e.touches.length === 2){
    targetT = clamp01(pinchT + (touchDist(e)-pinchStart)*0.004);
    slider.value = Math.round(targetT*100);
  }
}, {passive:false});
el.addEventListener('touchend', e=>{
  if(dragging && e.touches.length === 0 && tMoved < 8 && performance.now()-tDownT < 350) pick(tx, ty);
  if(e.touches.length === 0) dragging = false;
}, {passive:false});

// ---- controls ----
slider.addEventListener('input', ()=>{ targetT = slider.value/100; });
document.getElementById('close').addEventListener('click', deselect);
document.getElementById('resetBtn').addEventListener('click', ()=>{
  theta = 0.7; phi = 1.15; targetT = 0; slider.value = 0; deselect();
});
const rotateBtn = document.getElementById('rotateBtn');
rotateBtn.addEventListener('click', ()=>{
  autoRotate = !autoRotate; rotateBtn.classList.toggle('active', autoRotate);
});

window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
